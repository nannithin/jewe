<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Form</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<main class="min-h-screen">
  <div class="form-container">

    <!-- SUCCESS -->
    <div id="successContainer" style="display:none">
      <div class="success-message">
        <div class="success-icon">✓</div>
        <h2>Registration Successful!</h2>
        <p>Your profile has been submitted successfully.</p>
        <button class="btn-submit" onclick="location.reload()">Register Another</button>
      </div>
    </div>

    <!-- FORM -->
    <form id="registrationForm">

      <h1>Create Your Account</h1>
      <p class="subtitle">Join our community and get started in minutes</p>

      <div id="errorAlert" class="alert alert-error">
        <span class="alert-icon">⚠️</span>
        <span id="errorMessage"></span>
      </div>

      <!-- NAME -->
      <div class="form-grid">
        <div class="form-group">
          <label class="required">First Name</label>
          <input type="text" id="firstName" placeholder="John" />
          <div class="error-message"></div>
        </div>
        <div class="form-group">
          <label class="required">Last Name</label>
          <input type="text" id="lastName" placeholder="Doe" />
          <div class="error-message"></div>
        </div>
      </div>

      <!-- EMAIL -->
      <div class="form-grid full">
        <div class="form-group">
          <label class="required">Email Address</label>
          <input type="email" id="email" placeholder="john@example.com" />
          <div class="error-message"></div>
        </div>
      </div>

      <!-- PHONE + AGE -->
      <div class="form-grid">
        <div class="form-group">
          <label class="required">Phone Number</label>
          <input type="tel" id="phone" placeholder="+1 (555) 000-0000" />
          <div class="error-message"></div>
        </div>
        <div class="form-group">
          <label>Age</label>
          <input type="number" id="age" min="1" max="120" />
          <div class="error-message"></div>
        </div>
      </div>

      <!-- GENDER -->
      <div class="form-group">
        <label class="required">Gender</label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="gender" value="Male"> Male</label>
          <label><input type="checkbox" name="gender" value="Female"> Female</label>
          <label><input type="checkbox" name="gender" value="Other"> Other</label>
        </div>
        <div class="error-message"></div>
      </div>

      <!-- ADDRESS -->
      <div class="form-grid full">
        <div class="form-group">
          <label>Address</label>
          <input type="text" id="address" placeholder="123 Main Street" />
          <div class="error-message"></div>
        </div>
      </div>

      <!-- COUNTRY / STATE / CITY -->
      <div class="form-grid">
        <div class="form-group">
          <label>Country</label>
          <select id="country">
            <option value="">Select Country</option>
            <option>United States</option>
            <option>Canada</option>
            <option>United Kingdom</option>
            <option>Australia</option>
          </select>
          <div class="error-message"></div>
        </div>
        <div class="form-group">
          <label>State</label>
          <select id="state">
            <option value="">Select State</option>
          </select>
          <div class="error-message"></div>
        </div>
      </div>

      <div class="form-grid full">
        <div class="form-group">
          <label>City</label>
          <select id="city">
            <option value="">Select City</option>
          </select>
          <div class="error-message"></div>
        </div>
      </div>

      <div class="section-divider">Security</div>

      <!-- PASSWORD -->
      <div class="form-group">
        <label class="required">Password</label>
        <input type="password" id="password" />
        <div class="strength-meter">
          <div class="strength-bar"></div>
        </div>
        <div class="strength-text"></div>
        <div class="error-message"></div>
      </div>

      <div class="form-group">
        <label class="required">Confirm Password</label>
        <input type="password" id="confirmPassword" />
        <div class="error-message"></div>
      </div>

      <!-- TERMS -->
      <label class="checkbox-label">
        <input type="checkbox" id="termsCheckbox" />
        I agree to the Terms & Conditions *
      </label>
      <div class="error-message"></div>

      <!-- BUTTONS -->
      <div class="button-container">
        <button type="submit" class="btn-submit" id="submitBtn">Register Now</button>
        <button type="reset" class="btn-reset">Clear Form</button>
      </div>

    </form>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
